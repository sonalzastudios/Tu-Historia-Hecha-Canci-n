<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7fa">
  <title>Tu canción está lista — SONALZA STUDIOS</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#0b1f3a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.wrap{min-height:100vh;padding:28px 16px 54px}.shell{width:min(760px,100%);margin:0 auto;background:#fff;border:1px solid #e8edf3;border-radius:30px;box-shadow:0 24px 70px rgba(11,31,58,.08);overflow:hidden}.top{padding:26px 30px 16px;text-align:center}.brand{font-size:26px;font-weight:800;letter-spacing:.12em}.brand-sub{margin-top:6px;font-size:10px;letter-spacing:.28em;color:#7b8797}.lang-switch{display:flex;justify-content:center;gap:8px;margin-top:18px}.lang-btn{border:1px solid #dce3eb;background:#fff;color:#526174;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}.lang-btn.active{background:#0b1f3a;color:#fff;border-color:#0b1f3a}.hero{padding:28px 34px 18px;text-align:center}.pill{display:inline-block;padding:8px 12px;border-radius:999px;background:#fff6ed;color:#a85311;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.hero h1{margin:20px 0 12px;font-size:38px;line-height:1.08;letter-spacing:-.04em}.hero p{max-width:570px;margin:0 auto;color:#5d6b7e;font-size:16px;line-height:1.7}.cover-wrap{padding:26px 34px 10px;display:flex;justify-content:center}.cover{width:min(360px,100%);aspect-ratio:1/1;border-radius:26px;background:linear-gradient(145deg,#0b1f3a,#203f66);display:grid;place-items:center;box-shadow:0 18px 42px rgba(11,31,58,.18);overflow:hidden}.cover img{display:none;width:100%;height:100%;object-fit:cover}.cover-fallback{padding:24px;text-align:center;color:#fff}.cover-fallback strong{display:block;font-size:28px;letter-spacing:.08em}.cover-fallback span{display:block;margin-top:10px;font-size:12px;letter-spacing:.2em;opacity:.72}.player-card{margin:26px 34px 0;background:#f7f9fc;border:1px solid #e6ebf1;border-radius:22px;padding:24px}.song-title{font-size:24px;font-weight:750;letter-spacing:-.025em;text-align:center;margin-bottom:18px}.player{display:flex;align-items:center;gap:14px}.play-btn{flex:0 0 54px;width:54px;height:54px;border:0;border-radius:50%;background:#0b1f3a;color:#fff;font-size:20px;cursor:pointer}.timeline{flex:1}.bar{height:8px;border-radius:999px;background:#dfe5ec;overflow:hidden;cursor:pointer}.progress{width:0;height:100%;background:#0b1f3a;border-radius:999px}.times{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:#7d8998}.actions{padding:22px 34px 10px;display:grid;gap:12px}.primary,.secondary{display:block;text-align:center;text-decoration:none;border:0;border-radius:999px;padding:16px 22px;font-size:15px;font-weight:750;cursor:pointer}.primary{background:#0b1f3a;color:#fff}.secondary{background:#eef2f6;color:#0b1f3a}.revision,.community{margin:26px 34px 0;border-top:1px solid #edf0f4;padding:26px 0 0}.revision h2,.community h2{font-size:18px;margin:0 0 8px}.revision p,.community p{margin:0;color:#657184;line-height:1.7;font-size:14px}.community-card,.revision-box{margin-top:16px;background:#f7f9fc;border:1px solid #e6ebf1;border-radius:20px;padding:20px}.community-card strong{display:block;font-size:15px;margin-bottom:6px}.choice-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.choice-btn{border:1px solid #dbe2ea;background:#fff;color:#0b1f3a;border-radius:999px;padding:11px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:.18s}.choice-btn:hover{border-color:#0b1f3a}.choice-btn.selected{background:#0b1f3a;color:#fff;border-color:#0b1f3a}.choice-btn:disabled{opacity:.5;cursor:not-allowed}.upload-box{margin-top:16px;border:1px dashed #cfd8e3;border-radius:16px;padding:16px;background:#fff}.upload-box input{width:100%;font-size:13px}.mini-note{margin-top:8px!important;font-size:12px!important;color:#8792a1!important}.mini-note.success{color:#16794b!important;font-weight:700}.mini-note.error-note{color:#b42318!important;font-weight:700}.contact-note{margin-top:14px!important;padding:12px 14px;border-radius:14px;background:#fff7ed;color:#8a4b12!important;border:1px solid #f3dcc3}.contact-note a{color:#0b1f3a;font-weight:700}.consent-line{margin-top:14px;display:flex;gap:9px;align-items:flex-start;font-size:12px;color:#657184}.consent-line input{margin-top:3px}textarea{width:100%;min-height:150px;border:1px solid #dbe2ea;border-radius:16px;padding:14px;font:inherit;font-size:14px;color:#0b1f3a;resize:vertical;outline:none;background:#fff}.footer{text-align:center;padding:38px 30px 34px;color:#8792a1;font-size:12px}.footer strong{display:block;color:#0b1f3a;letter-spacing:.1em;margin-bottom:7px}.social{margin-top:14px}.social a{color:#0b1f3a;text-decoration:none}.dot{padding:0 8px;color:#c2c9d2}.hidden{display:none!important}.error{padding:80px 30px;text-align:center}.error h1{font-size:30px;margin-bottom:10px}.error p,.loading{color:#667386}.loading{padding:80px 30px;text-align:center}@media(max-width:620px){.shell{border-radius:24px}.hero{padding-left:24px;padding-right:24px}.hero h1{font-size:32px}.cover-wrap,.player-card,.actions,.revision,.community{margin-left:22px;margin-right:22px}.cover-wrap{padding-left:0;padding-right:0}.player-card{padding:20px}.song-title{font-size:21px}.choice-row{display:grid;grid-template-columns:1fr}.choice-btn{width:100%}}
  </style>
</head>
<body>
<main class="wrap"><section class="shell">
  <div class="top"><div class="brand">SONALZA</div><div class="brand-sub">STUDIOS</div><div class="lang-switch"><button id="langEn" class="lang-btn" type="button">🇺🇸 English</button><button id="langEs" class="lang-btn" type="button">🇲🇽 Español</button></div></div>
  <div id="loading" class="loading">Cargando tu entrega…</div>
  <div id="errorView" class="error hidden"><h1>Esta entrega no está disponible.</h1><p>El enlace puede haber expirado o ser incorrecto.</p></div>
  <div id="deliveryView" class="hidden">
    <section class="hero"><div class="pill" id="deliveryPill"></div><h1 id="heroTitle"></h1><p id="heroCopy"></p></section>
    <div class="cover-wrap"><div class="cover"><img id="coverImage" alt="Portada de la canción"><div id="coverFallback" class="cover-fallback"><strong>SONALZA</strong><span>ORIGINAL</span></div></div></div>
    <section class="player-card"><div class="song-title" id="songTitle"></div><div class="player"><button class="play-btn" id="playBtn" type="button">▶</button><div class="timeline"><div class="bar" id="bar"><div class="progress" id="progress"></div></div><div class="times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div></div></div><audio id="audio" preload="metadata"></audio></section>
    <div class="actions"><a class="primary" id="downloadBtn" href="#" download></a><button class="secondary" id="revisionBtn" type="button"></button></div>
    <section id="revisionForm" class="revision hidden"><h2 id="revisionFormTitle"></h2><p id="revisionFormCopy"></p><div class="revision-box"><textarea id="revisionNotes" maxlength="4000"></textarea><div class="choice-row"><button class="choice-btn" id="submitRevisionBtn" type="button"></button><button class="choice-btn" id="cancelRevisionBtn" type="button"></button></div><p class="mini-note" id="revisionStatus"></p></div></section>
    <section class="community"><h2 id="shareTitle"></h2><p id="shareCopy"></p><div class="community-card"><strong id="shareQuestion"></strong><div class="choice-row"><button class="choice-btn" id="shareYes" type="button"></button><button class="choice-btn" id="shareNo" type="button"></button></div><p class="mini-note" id="shareNote"></p><p id="shareLockedNote" class="contact-note hidden"></p></div></section>
    <section class="community"><h2 id="reactionTitle"></h2><p id="reactionCopy"></p><div class="community-card"><strong id="videoQuestion"></strong><div class="upload-box"><input id="reactionVideo" type="file" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.webm"><p class="mini-note" id="videoNote"></p></div><label class="consent-line"><input id="videoPublishConsent" type="checkbox"><span id="videoConsentText"></span></label><div class="choice-row"><button class="choice-btn" id="uploadVideoBtn" type="button"></button></div></div></section>
    <section class="revision"><h2 id="revisionTitle"></h2><p id="revisionCopy"></p></section>
    <footer class="footer"><strong>SONALZA STUDIOS</strong><div>Turn your story into music.</div><div class="social"><a href="https://instagram.com/sonalzastudios">Instagram</a><span class="dot">·</span><a href="https://tiktok.com/@sonalzastudios">TikTok</a><span class="dot">·</span><a href="https://youtube.com/@sonalzastudios">YouTube</a></div></footer>
  </div>
</section></main>
<script>
const qs=new URLSearchParams(location.search),token=qs.get('token')||'';const $=id=>document.getElementById(id);
const audio=$('audio'),playBtn=$('playBtn'),progress=$('progress'),bar=$('bar'),currentTime=$('currentTime'),duration=$('duration'),shareYes=$('shareYes'),shareNo=$('shareNo'),shareNote=$('shareNote'),shareLockedNote=$('shareLockedNote'),reactionVideo=$('reactionVideo'),videoPublishConsent=$('videoPublishConsent'),uploadVideoBtn=$('uploadVideoBtn'),videoNote=$('videoNote'),revisionBtn=$('revisionBtn'),revisionForm=$('revisionForm'),revisionNotes=$('revisionNotes'),submitRevisionBtn=$('submitRevisionBtn'),cancelRevisionBtn=$('cancelRevisionBtn'),revisionStatus=$('revisionStatus'),langEn=$('langEn'),langEs=$('langEs');
let pageLanguage='es',deliveryData=null,consentState=null;
const copy={es:{pill:'ENTREGA LISTA',hero:'Tu canción está lista.',heroCopy:'Gracias por confiar en nosotros para convertir tu historia en música. Amamos esta canción y esperamos que tú también.',download:'Descargar MP3',revision:'Solicitar revisión',revisionCopy:'Escribe todos los cambios que deseas en una sola solicitud. Sé lo más específico posible.',revisionPlaceholder:'Describe aquí todos los cambios que deseas...',submit:'Enviar solicitud',cancel:'Cancelar',shareTitle:'¿Quieres compartir esta historia con el mundo?',shareCopy:'Si te encanta el resultado, puedes autorizarnos a compartir esta canción en nuestras redes sociales, canales oficiales y sitio web.',shareQuestion:'¿Autorizas a SONALZA a publicar esta canción en social media, canales oficiales y sonalza.com?',yes:'Sí, autorizo',no:'No, mantener privada',private:'Tu canción permanecerá privada a menos que nos des permiso explícito.',locked:'¿Cambiaste de opinión? Contacta a SONALZA para solicitar que retiremos el contenido de nuestros canales oficiales.',reactionTitle:'¿Capturaste el momento?',reactionCopy:'Si grabaste la reacción de la persona que recibió la canción, nos encantaría verla. Puedes compartir ese momento con SONALZA.',videoQuestion:'Comparte tu video de reacción',videoNote:'El video se compartirá primero de forma privada con SONALZA.',videoConsent:'También autorizo a SONALZA a publicar este video de reacción en sus redes sociales, canales oficiales y sitio web como testimonio o contenido promocional.',upload:'Subir video',revisionTitle:'Tu revisión incluida',revisionInfo:'Tu canción incluye una ronda consolidada de revisión. Escúchala completa y, si deseas cambios, envíanos todos tus comentarios juntos.',songFallback:'Tu canción SONALZA'},en:{pill:'DELIVERY READY',hero:'Your song is ready.',heroCopy:'Thank you for trusting us to turn your story into music. We loved creating this song, and we hope you love it too.',download:'Download MP3',revision:'Request revision',revisionCopy:'Please include all requested changes in one submission and be as specific as possible.',revisionPlaceholder:'Describe all requested changes here...',submit:'Submit request',cancel:'Cancel',shareTitle:'Would you like to share this story with the world?',shareCopy:'If you love the result, you can authorize us to share this song on our social media, official channels, and website.',shareQuestion:'Do you authorize SONALZA to publish this song on social media, official channels, and sonalza.com?',yes:'Yes, I authorize',no:'No, keep it private',private:'Your song will remain private unless you explicitly give us permission.',locked:'Changed your mind? Contact SONALZA to request removal from our official channels.',reactionTitle:'Did you capture the moment?',reactionCopy:'If you recorded the reaction of the person who received the song, we would love to see it. You can share that moment with SONALZA.',videoQuestion:'Share your reaction video',videoNote:'The video will first be shared privately with SONALZA.',videoConsent:'I also authorize SONALZA to publish this reaction video on its social media, official channels, and website as a testimonial or promotional content.',upload:'Upload video',revisionTitle:'Your included revision',revisionInfo:'Your song includes one consolidated revision round. Listen to the full song and, if you would like changes, send all requested adjustments together.',songFallback:'Your SONALZA song'}};
function fmt(s){if(!Number.isFinite(s))return'0:00';return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`}
function setLanguage(lang){pageLanguage=lang==='en'?'en':'es';localStorage.setItem('sonalza_delivery_language',pageLanguage);document.documentElement.lang=pageLanguage;const c=copy[pageLanguage];langEn.classList.toggle('active',pageLanguage==='en');langEs.classList.toggle('active',pageLanguage==='es');$('deliveryPill').textContent=c.pill;$('heroTitle').textContent=c.hero;$('heroCopy').textContent=c.heroCopy;$('downloadBtn').textContent=c.download;revisionBtn.textContent=c.revision;$('revisionFormTitle').textContent=c.revision;$('revisionFormCopy').textContent=c.revisionCopy;revisionNotes.placeholder=c.revisionPlaceholder;submitRevisionBtn.textContent=c.submit;cancelRevisionBtn.textContent=c.cancel;$('shareTitle').textContent=c.shareTitle;$('shareCopy').textContent=c.shareCopy;$('shareQuestion').textContent=c.shareQuestion;shareYes.textContent=c.yes;shareNo.textContent=c.no;$('reactionTitle').textContent=c.reactionTitle;$('reactionCopy').textContent=c.reactionCopy;$('videoQuestion').textContent=c.videoQuestion;videoNote.textContent=c.videoNote;$('videoConsentText').textContent=c.videoConsent;uploadVideoBtn.textContent=c.upload;$('revisionTitle').textContent=c.revisionTitle;$('revisionCopy').textContent=c.revisionInfo;$('songTitle').textContent=deliveryData?.song_title||c.songFallback;renderConsentState()}
function renderConsentState(){const c=copy[pageLanguage],s=consentState||{};shareYes.classList.toggle('selected',s.current_choice==='yes');shareNo.classList.toggle('selected',s.current_choice==='no');shareYes.disabled=!!s.locked;shareNo.disabled=!!s.locked;if(s.locked){shareLockedNote.textContent=c.locked;shareLockedNote.classList.remove('hidden');shareNote.textContent=s.current_choice==='yes'?(pageLanguage==='en'?'Current authorization: YES.':'Autorización vigente: SÍ.'):(pageLanguage==='en'?'Current authorization: NO.':'Autorización vigente: NO.')}else{shareLockedNote.classList.add('hidden');shareNote.textContent=s.response_count===1?(pageLanguage==='en'?'You may change this choice one time.':'Puedes cambiar esta decisión una sola vez.'):c.private}}
async function loadDelivery(){if(!token)return;try{const r=await fetch(`/api/delivery?token=${encodeURIComponent(token)}`,{cache:'no-store'});if(!r.ok)throw new Error();deliveryData=await r.json();if(!deliveryData?.ok||!deliveryData?.audio_url)throw new Error();consentState=deliveryData.song_consent||null;audio.src=deliveryData.audio_url;$('downloadBtn').href=deliveryData.download_url||deliveryData.audio_url;if(deliveryData.cover_url){$('coverImage').src=deliveryData.cover_url;$('coverImage').style.display='block';$('coverFallback').classList.add('hidden')}const saved=localStorage.getItem('sonalza_delivery_language');setLanguage(saved==='en'||saved==='es'?saved:(deliveryData.language==='en'?'en':'es'));$('loading').classList.add('hidden');$('deliveryView').classList.remove('hidden')}catch(_){$('loading').classList.add('hidden');$('errorView').classList.remove('hidden')}}
async function savePublishConsent(choice){if(consentState?.locked)return;shareYes.disabled=true;shareNo.disabled=true;shareNote.textContent=pageLanguage==='en'?'Saving your choice…':'Guardando tu elección…';try{const r=await fetch('/api/delivery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action:'song_publish_consent',choice})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d?.error||'save');consentState=d.song_consent||consentState;renderConsentState()}catch(err){shareNote.className='mini-note error-note';shareNote.textContent=err.message==='CONSENT_CHANGE_LIMIT_REACHED'||consentState?.locked?copy[pageLanguage].locked:(pageLanguage==='en'?'We could not save your choice. Please try again.':'No pudimos guardar tu elección. Intenta nuevamente.')}finally{renderConsentState()}}
async function uploadReactionVideo(){const file=reactionVideo.files?.[0];if(!file){videoNote.textContent=pageLanguage==='en'?'Choose a video first.':'Selecciona un video primero.';return}uploadVideoBtn.disabled=true;videoNote.textContent=pageLanguage==='en'?'Preparing secure upload…':'Preparando subida segura…';try{const prep=await fetch('/api/delivery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action:'prepare_reaction_upload',content_type:file.type,size:file.size})});const p=await prep.json();if(!prep.ok||!p?.upload?.signed_url)throw new Error();videoNote.textContent=pageLanguage==='en'?'Uploading video…':'Subiendo video…';const up=await fetch(p.upload.signed_url,{method:'PUT',headers:{'Content-Type':p.upload.content_type||file.type},body:file});if(!up.ok)throw new Error();const done=await fetch('/api/delivery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action:'reaction_video_uploaded',bucket:p.upload.bucket,path:p.upload.path,publish_authorized:videoPublishConsent.checked})});const d=await done.json();if(!done.ok||!d.ok)throw new Error();videoNote.textContent=pageLanguage==='en'?'✓ Thank you. Your reaction video was shared with SONALZA.':'✓ Gracias. Tu video de reacción fue compartido con SONALZA.';reactionVideo.disabled=true;videoPublishConsent.disabled=true;uploadVideoBtn.disabled=true}catch(_){videoNote.textContent=pageLanguage==='en'?'We could not upload your video. Please try again.':'No pudimos subir tu video. Intenta nuevamente.';uploadVideoBtn.disabled=false}}
async function submitRevision(){const notes=revisionNotes.value.trim();if(notes.length<5){revisionStatus.textContent=pageLanguage==='en'?'Please describe the requested changes.':'Describe los cambios que deseas.';return}submitRevisionBtn.disabled=true;try{const r=await fetch('/api/delivery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action:'revision_request',notes})});const d=await r.json();if(!r.ok||!d.ok)throw new Error();revisionStatus.textContent=pageLanguage==='en'?'✓ Your revision request was received.':'✓ Recibimos tu solicitud de revisión.';revisionNotes.disabled=true;cancelRevisionBtn.classList.add('hidden')}catch(_){revisionStatus.textContent=pageLanguage==='en'?'We could not send your request. Please try again.':'No pudimos enviar tu solicitud. Intenta nuevamente.';submitRevisionBtn.disabled=false}}
langEn.addEventListener('click',()=>setLanguage('en'));langEs.addEventListener('click',()=>setLanguage('es'));revisionBtn.addEventListener('click',()=>{revisionForm.classList.remove('hidden');revisionForm.scrollIntoView({behavior:'smooth',block:'center'});revisionNotes.focus()});cancelRevisionBtn.addEventListener('click',()=>revisionForm.classList.add('hidden'));submitRevisionBtn.addEventListener('click',submitRevision);shareYes.addEventListener('click',()=>savePublishConsent('yes'));shareNo.addEventListener('click',()=>savePublishConsent('no'));uploadVideoBtn.addEventListener('click',uploadReactionVideo);playBtn.addEventListener('click',async()=>{if(audio.paused){try{await audio.play()}catch(_){}}else audio.pause()});audio.addEventListener('play',()=>playBtn.textContent='❚❚');audio.addEventListener('pause',()=>playBtn.textContent='▶');audio.addEventListener('ended',()=>playBtn.textContent='▶');audio.addEventListener('loadedmetadata',()=>duration.textContent=fmt(audio.duration));audio.addEventListener('timeupdate',()=>{currentTime.textContent=fmt(audio.currentTime);progress.style.width=`${audio.duration?(audio.currentTime/audio.duration)*100:0}%`});bar.addEventListener('click',e=>{if(!audio.duration)return;const r=bar.getBoundingClientRect();audio.currentTime=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*audio.duration});loadDelivery();
</script>
</body>
</html>
