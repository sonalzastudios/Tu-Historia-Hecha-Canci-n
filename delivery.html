function fmt(s){if(!Number.isFinite(s))return'0:00';return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`}
function setLanguage(lang){pageLanguage=lang==='en'?'en':'es';localStorage.setItem('sonalza_delivery_language',pageLanguage);document.documentElement.lang=pageLanguage;const c=copy[pageLanguage];langEn.classList.toggle('active',pageLanguage==='en');langEs.classList.toggle('active',pageLanguage==='es');$('deliveryPill').textContent=c.pill;$('heroTitle').textContent=c.hero;$('heroCopy').textContent=c.heroCopy;$('downloadBtn').textContent=c.download;revisionBtn.textContent=c.revision;$('revisionFormTitle').textContent=c.revision;$('revisionFormCopy').textContent=c.revisionCopy;revisionNotes.placeholder=c.revisionPlaceholder;submitRevisionBtn.textContent=c.submit;cancelRevisionBtn.textContent=c.cancel;$('shareTitle').textContent=c.shareTitle;$('shareCopy').textContent=c.shareCopy;$('shareQuestion').textContent=c.shareQuestion;shareYes.textContent=c.yes;shareNo.textContent=c.no;$('reactionTitle').textContent=c.reactionTitle;$('reactionCopy').textContent=c.reactionCopy;$('videoQuestion').textContent=c.videoQuestion;videoNote.textContent=c.videoNote;$('videoConsentText').textContent=c.videoConsent;uploadVideoBtn.textContent=c.upload;$('revisionTitle').textContent=c.revisionTitle;$('revisionCopy').textContent=c.revisionInfo;$('songTitle').textContent=deliveryData?.song_title||c.songFallback;approveBtn.textContent=c.approve;$('decisionTitle').textContent=c.decisionTitle;$('decisionCopy').textContent=c.decisionCopy;$('surveyTitle').textContent=c.surveyTitle;$('surveyCopy').textContent=c.surveyCopy;$('qEase').textContent=c.qEase;$('qDelivery').textContent=c.qDelivery;$('qSatisfaction').textContent=c.qSatisfaction;$('qRecommend').textContent=c.qRecommend;$('qComment').textContent=c.qComment;surveyComment.placeholder=pageLanguage==='en'?'Optional comment...':'Comentario opcional...';submitSurveyBtn.textContent=c.surveySubmit;$('postShareTitle').textContent=c.postShareTitle;$('postShareCopy').textContent=c.postShareCopy;$('easeLow').textContent=c.easeLow;$('easeHigh').textContent=c.easeHigh;$('deliveryLow').textContent=c.deliveryLow;$('deliveryHigh').textContent=c.deliveryHigh;$('satisfactionLow').textContent=c.satisfactionLow;$('satisfactionHigh').textContent=c.satisfactionHigh;$('recommendLow').textContent=c.recommendLow;$('recommendHigh').textContent=c.recommendHigh;$('shareSongGroupTitle').textContent=c.shareSongGroup;$('shareSonalzaGroupTitle').textContent=c.shareSonalzaGroup;$('shareNativeLabel').textContent=c.shareNative;$('downloadShareLabel').textContent=c.downloadShare;$('copyLinkLabel').textContent=c.copyLink;renderConsentState()}
function renderConsentState(){const c=copy[pageLanguage],s=consentState||{};shareYes.classList.toggle('selected',s.current_choice==='yes');shareNo.classList.toggle('selected',s.current_choice==='no');shareYes.disabled=!!s.locked;shareNo.disabled=!!s.locked;if(s.locked){shareLockedNote.textContent=c.locked;shareLockedNote.classList.remove('hidden');shareNote.textContent=s.current_choice==='yes'?(pageLanguage==='en'?'Current authorization: YES.':'Autorización vigente: SÍ.'):(pageLanguage==='en'?'Current authorization: NO.':'Autorización vigente: NO.')}else{shareLockedNote.classList.add('hidden');shareNote.textContent=s.response_count===1?(pageLanguage==='en'?'You may change this choice one time.':'Puedes cambiar esta decisión una sola vez.'):c.private}}
async function loadDelivery(){if(!token)return;try{const r=await fetch(`/api/delivery?token=${encodeURIComponent(token)}`,{cache:'no-store'});if(!r.ok)throw new Error();deliveryData=await r.json();if(!deliveryData?.ok||!deliveryData?.audio_url)throw new Error();consentState=deliveryData.song_consent||null;audio.src=deliveryData.audio_url;$('downloadBtn').href=deliveryData.download_url||deliveryData.audio_url;if(deliveryData.cover_url){$('coverImage').src=deliveryData.cover_url;$('coverImage').style.display='block';$('coverFallback').classList.add('hidden')}if(!deliveryData.revision_available)revisionBtn.classList.add('hidden');const isApproved=['approved','revision_approved'].includes(String(deliveryData.fulfillment_status||''));if(isApproved)decisionBox.classList.add('hidden');const saved=localStorage.getItem('sonalza_delivery_language');setLanguage(saved==='en'||saved==='es'?saved:(deliveryData.language==='en'?'en':'es'));$('loading').classList.add('hidden');$('deliveryView').classList.remove('hidden');const surveyRequested=qs.get('survey')==='1';const preview=qs.get('preview')||'';if(preview==='survey'){approvedBox.classList.add('hidden');setTimeout(()=>openSurveyModal('survey'),120)}else if(preview==='share'){approvedBox.classList.add('hidden');setTimeout(()=>openSurveyModal('share'),120)}else if(!deliveryData.survey?.completed&&(isApproved||surveyRequested)){if(isApproved){approvedBox.textContent=copy[pageLanguage].approved;approvedBox.classList.remove('hidden')}setTimeout(()=>openSurveyModal('survey'),120)}else if(deliveryData.survey?.completed){approvedBox.classList.add('hidden');postSurveyShare.classList.remove('hidden')}}catch(_){$('loading').classList.add('hidden');$('errorView').classList.remove('hidden')}}
async function savePublishConsent(choice){if(consentState?.locked)return;shareYes.disabled=true;shareNo.disabled=true;shareNote.textContent=pageLanguage==='en'?'Saving your choice…':'Guardando tu elección…';try{const r=await fetch('/api/delivery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action:'song_publish_consent',choice})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d?.error||'save');consentState=d.song_consent||consentState;renderConsentState()}catch(err){shareNote.className='mini-note error-note';shareNote.textContent=err.message==='CONSENT_CHANGE_LIMIT_REACHED'||consentState?.locked?copy[pageLanguage].locked:(pageLanguage==='en'?'We could not save your choice. Please try again.':'No pudimos guardar tu elección. Intenta nuevamente.')}finally{renderConsentState()}}

function renderRatings(){document.querySelectorAll('.rating-row').forEach(row=>{const key=row.dataset.rating;row.innerHTML='';for(let i=1;i<=5;i++){const b=document.createElement('button');b.type='button';b.className='rating-btn'+(surveyRatings[key]===i?' selected':'');b.textContent=String(i);b.addEventListener('click',()=>{surveyRatings[key]=i;renderRatings()});row.appendChild(b)}})}
function openSurveyModal(step='survey'){surveyModal.classList.remove('hidden');document.body.style.overflow='hidden';surveySection.classList.toggle('hidden',step!=='survey');postSurveyShare.classList.toggle('hidden',step!=='share');if(step==='survey')renderRatings()}
function closeSurveyModal(){surveyModal.classList.add('hidden');document.body.style.overflow=''}
async function approveSong(){approveBtn.disabled=true;try{const r=await fetch('/api/delivery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action:'song_approved'})});const d=await r.json();if(!r.ok||!d.ok)throw new Error();decisionBox.classList.add('hidden');approvedBox.textContent=copy[pageLanguage].approved;approvedBox.classList.remove('hidden');openSurveyModal('survey')}catch(_){approveBtn.disabled=false}}
async function submitSurvey(){if(Object.values(surveyRatings).some(v=>!v)){surveyStatus.textContent=pageLanguage==='en'?'Please answer all 4 ratings.':'Responde las 4 calificaciones.';return}submitSurveyBtn.disabled=true;surveyStatus.textContent=pageLanguage==='en'?'Sending…':'Enviando…';try{const r=await fetch('/api/delivery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action:'customer_survey',...surveyRatings,comment:surveyComment.value.trim()})});const d=await r.json();if(!r.ok||!d.ok)throw new Error();surveyStatus.textContent=pageLanguage==='en'?'✓ Thank you for your feedback.':'✓ Gracias por compartir tu opinión.';setTimeout(()=>{approvedBox.classList.add('hidden');openSurveyModal('share')},450)}catch(_){surveyStatus.textContent=pageLanguage==='en'?'We could not save your feedback. Please try again.':'No pudimos guardar tu opinión. Intenta nuevamente.';submitSurveyBtn.disabled=false}}
async function getSongFile(){const url=deliveryData?.download_url||deliveryData?.audio_url;if(!url)throw new Error('missing');const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('fetch');const blob=await r.blob();const safe=(deliveryData.song_title||'SONALZA').replace(/[^a-z0-9áéíóúüñ _-]/gi,'').trim()||'SONALZA';return new File([blob],`${safe}.mp3`,{type:'audio/mpeg'})}
async function shareSongFile(){shareSongNote.textContent='';try{const file=await getSongFile();if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:deliveryData.song_title||'SONALZA'});return}downloadSong();shareSongNote.textContent=pageLanguage==='en'?'Direct file sharing is not available in this browser. The MP3 was downloaded so you can share it from your device.':'Este navegador no permite compartir el archivo directamente. Descargamos el MP3 para que puedas compartirlo desde tu dispositivo.'}catch(err){downloadSong();shareSongNote.textContent=pageLanguage==='en'?'We downloaded the MP3 so you can share it from your device.':'Descargamos el MP3 para que puedas compartirlo desde tu dispositivo.'}}
function downloadSong(){const url=deliveryData?.download_url||deliveryData?.audio_url;if(!url)return;const safe=(deliveryData.song_title||'SONALZA').replace(/[^a-z0-9áéíóúüñ _-]/gi,'').trim()||'SONALZA';const a=document.createElement('a');a.href=url;a.download=`${safe}.mp3`;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
function sonalzaShareText(){return pageLanguage==='en'?'Turn a special story into a personalized song with SONALZA.':'Convierte una historia especial en una canción personalizada con SONALZA.'}
function openShareUrl(url){window.open(url,'_blank','noopener,noreferrer')}
function shareSonalzaWhatsApp(){openShareUrl('https://wa.me/?text='+encodeURIComponent(sonalzaShareText()+' https://sonalza.com/?ref=share'))}
function shareSonalzaFacebook(){openShareUrl('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent('https://sonalza.com/?ref=share'))}
function shareSonalzaX(){openShareUrl('https://twitter.com/intent/tweet?text='+encodeURIComponent(sonalzaShareText())+'&url='+encodeURIComponent('https://sonalza.com/?ref=share'))}
function shareSonalzaEmail(){location.href='mailto:?subject='+encodeURIComponent('SONALZA')+'&body='+encodeURIComponent(sonalzaShareText()+' https://sonalza.com/?ref=share')}
async function shareSonalza(){const url='https://sonalza.com/?ref=share';try{await navigator.clipboard.writeText(url);shareSongNote.textContent=pageLanguage==='en'?'SONALZA link copied.':'Enlace de SONALZA copiado.'}catch(_){shareSongNote.textContent=url}}
async function uploadReactionVideo(){const file=reactionVideo.files?.[0];if(!file){videoNote.textContent=pageLanguage==='en'?'Choose a video first.':'Selecciona un video primero.';return}uploadVideoBtn.disabled=true;videoNote.textContent=pageLanguage==='en'?'Preparing secure upload…':'Preparando subida segura…';try{const prep=await fetch('/api/delivery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action:'prepare_reaction_upload',content_type:file.type,size:file.size})});const p=await prep.json();if(!prep.ok||!p?.upload?.signed_url)throw new Error();videoNote.textContent=pageLanguage==='en'?'Uploading video…':'Subiendo video…';const form=new FormData();form.append('cacheControl','3600');form.append('',file);const up=await fetch(p.upload.signed_url,{method:'PUT',headers:{'x-upsert':'false'},body:form});if(!up.ok){const detail=await up.text().catch(()=> '');throw new Error(detail||'upload failed')}const done=await fetch('/api/delivery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action:'reaction_video_uploaded',bucket:p.upload.bucket,path:p.upload.path,publish_authorized:videoPublishConsent.checked})});const d=await done.json();if(!done.ok||!d.ok)throw new Error();videoNote.textContent=pageLanguage==='en'?'✓ Thank you. Your reaction video was shared with SONALZA.':'✓ Gracias. Tu video de reacción fue compartido con SONALZA.';reactionVideo.disabled=true;videoPublishConsent.disabled=true;uploadVideoBtn.disabled=true}catch(err){console.error('reaction video upload',err);videoNote.textContent=pageLanguage==='en'?'We could not upload your video. Please try again.':'No pudimos subir tu video. Intenta nuevamente.';uploadVideoBtn.disabled=false}}
async function submitRevision(){const notes=revisionNotes.value.trim();if(notes.length<5){revisionStatus.textContent=pageLanguage==='en'?'Please describe the requested changes.':'Describe los cambios que deseas.';return}submitRevisionBtn.disabled=true;try{const r=await fetch('/api/delivery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action:'revision_request',notes})});const d=await r.json();if(!r.ok||!d.ok)throw new Error();revisionStatus.textContent=pageLanguage==='en'?'✓ Your revision request was received.':'✓ Recibimos tu solicitud de revisión.';revisionNotes.disabled=true;cancelRevisionBtn.classList.add('hidden')}catch(_){revisionStatus.textContent=pageLanguage==='en'?'We could not send your request. Please try again.':'No pudimos enviar tu solicitud. Intenta nuevamente.';submitRevisionBtn.disabled=false}}
langEn.addEventListener('click',()=>setLanguage('en'));langEs.addEventListener('click',()=>setLanguage('es'));revisionBtn.addEventListener('click',()=>{revisionForm.classList.remove('hidden');revisionForm.scrollIntoView({behavior:'smooth',block:'center'});revisionNotes.focus()});cancelRevisionBtn.addEventListener('click',()=>revisionForm.classList.add('hidden'));submitRevisionBtn.addEventListener('click',submitRevision);shareYes.addEventListener('click',()=>savePublishConsent('yes'));shareNo.addEventListener('click',()=>savePublishConsent('no'));uploadVideoBtn.addEventListener('click',uploadReactionVideo);approveBtn.addEventListener('click',approveSong);modalCloseBtn.addEventListener('click',closeSurveyModal);surveyModal.addEventListener('click',e=>{if(e.target===surveyModal)closeSurveyModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!surveyModal.classList.contains('hidden'))closeSurveyModal()});submitSurveyBtn.addEventListener('click',submitSurvey);shareSongBtn.addEventListener('click',shareSongFile);$('shareSongNativeBtn').addEventListener('click',shareSongFile);$('downloadSongBtn').addEventListener('click',downloadSong);$('shareSonalzaWhatsApp').addEventListener('click',shareSonalzaWhatsApp);$('shareSonalzaFacebook').addEventListener('click',shareSonalzaFacebook);$('shareSonalzaX').addEventListener('click',shareSonalzaX);$('shareSonalzaEmail').addEventListener('click',shareSonalzaEmail);shareSonalzaBtn.addEventListener('click',shareSonalza);playBtn.addEventListener('click',async()=>{if(audio.paused){try{await audio.play()}catch(_){}}else audio.pause()});audio.addEventListener('play',()=>playBtn.textContent='❚❚');audio.addEventListener('pause',()=>playBtn.textContent='▶');audio.addEventListener('ended',()=>playBtn.textContent='▶');audio.addEventListener('loadedmetadata',()=>duration.textContent=fmt(audio.duration));audio.addEventListener('timeupdate',()=>{currentTime.textContent=fmt(audio.currentTime);progress.style.width=`${audio.duration?(audio.currentTime/audio.duration)*100:0}%`});bar.addEventListener('click',e=>{if(!audio.duration)return;const r=bar.getBoundingClientRect();audio.currentTime=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*audio.duration});loadDelivery();
