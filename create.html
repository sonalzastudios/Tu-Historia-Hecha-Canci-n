<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crea tu canción — SONALZA STUDIOS</title>
  <meta name="description" content="Cuéntanos tu historia y crea una canción personalizada con SONALZA STUDIOS.">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="flow" data-page="create">
  <div class="flow-wrap">
    <div class="flow-top">
      <a class="brand" href="index.html">SONALZA <span>STUDIOS</span></a>
      <a href="index.html">← Inicio</a>
    </div>
    <div class="progress-meta"><span id="stepLabel">Paso 1 de 8</span><strong id="pctLabel">13% completado</strong></div>
    <div class="progress"><div id="bar"></div></div>
    <div id="question" class="question"></div>
    <div class="flow-actions"><button id="backBtn" class="btn btn-outline">← Atrás</button><button id="nextBtn" class="btn btn-primary">Siguiente →</button></div>
  </div>

  <div id="exitModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head"><h2>Antes de irte — ¿qué te detuvo?</h2><button class="close" id="closeModal" aria-label="Cerrar">×</button></div>
      <p>Tu respuesta nos ayuda a mejorar SONALZA.</p>
      <button class="reason" data-reason="price"><strong>💸 Precio o costo total</strong><br><span>El precio se siente más alto de lo que esperaba.</span></button>
      <button class="reason" data-reason="examples"><strong>🎧 Necesito escuchar más ejemplos</strong><br><span>Quiero tener más confianza en cómo puede sonar.</span></button>
      <button class="reason" data-reason="story"><strong>🤔 No estoy seguro de que puedan contar bien mi historia</strong><br><span>Necesito entender mejor el proceso.</span></button>
      <button class="reason" data-reason="genre"><strong>🪗 Necesito otro estilo musical</strong><br><span>No encontré el género que quería.</span></button>
      <button class="reason" data-reason="payment"><strong>💳 Método de pago</strong><br><span>Necesito otra opción para pagar.</span></button>
      <button class="reason" data-reason="browsing"><strong>👀 Todavía estoy decidiendo</strong><br><span>Estoy comparando opciones.</span></button>
      <button class="reason" data-reason="other"><strong>💬 Otro motivo</strong></button>
      <div class="helper">Durante esta etapa de prueba, la respuesta se guarda únicamente en este navegador.</div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
