name: SONALZA homepage QA
on:
  push:
    branches: [feature/conversion-redesign-oct-2026]
  pull_request:
    branches: [main]
    paths: [index.html, home-v3.css, home-v3.js, tests/home_v3_qa.py, .github/workflows/home-v3-qa.yml]
permissions:
  contents: read
concurrency:
  group: sonalza-home-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test languages, layouts, navigation and audio
        run: python tests/home_v3_qa.py
      - name: Save review screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonalza-home-v3-review
          path: qa-output/
          retention-days: 7
