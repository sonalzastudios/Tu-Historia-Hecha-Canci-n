name: SONALZA homepage QA
on:
  push:
    branches: [feature/conversion-redesign-oct-2026]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sonalza-home-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test carousel, languages, real photos, audio and guided form
        run: python tests/home_v5_qa.py
      - name: Save screenshots and actual result report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonalza-home-v5-review
          path: qa-output/
          retention-days: 7
