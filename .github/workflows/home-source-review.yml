name: Frontend source review bundle
on:
  push:
    branches: [feature/conversion-redesign-oct-2026]
    paths: [.github/workflows/home-source-review.yml]
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: sonalza-frontend-source
          retention-days: 2
          path: |
            *.html
            *.css
            *.js
            assets/
            tests/
            docs/
